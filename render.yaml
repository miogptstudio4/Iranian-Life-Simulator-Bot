# Render Blueprint - Telegram bot + public health endpoint
services:
  - type: web
    name: iranian-life-sim-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DB_HOST
        fromDatabase:
          name: iranian-life-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: iranian-life-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: iranian-life-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: iranian-life-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iranian-life-db
          property: password
      - key: PYTHON_VERSION
        value: "3.13.5"

  # Optional separate lightweight health/landing service is not needed;
  # the Telegram process itself exposes /health on Render's $PORT.

databases:
  - name: iranian-life-db
    plan: free
    databaseName: iranian_life_sim
    user: iranian_sim
