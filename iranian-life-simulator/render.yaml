# Render.com Blueprint
# https://render.com/docs/blueprint-spec

services:
  # ربات تلگرام (Worker همیشه روشن)
  - type: worker
    name: iranian-life-sim-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        fromDatabase:
          name: iranian-life-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: iranian-life-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: iranian-life-db
          property: password
      - key: PYTHON_VERSION
        value: "3.12.0"

databases:
  - name: iranian-life-db
    plan: free
    databaseName: iranian_life_sim
    user: iranian_sim
